name: Supabase Keep-Alive

# Menjaga project Supabase (free plan) tidak di-pause karena tidak ada aktivitas.
# Hanya memakai kunci anon (publik). Jangan pernah memakai service_role di sini.

on:
  schedule:
    - cron: "0 3 */3 * *" # tiap 3 hari, 03:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sS -f --retry 3 --retry-delay 10 "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null -w "REST: HTTP %{http_code}\n"

      - name: Ping Auth health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sS -f --retry 3 --retry-delay 10 "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -o /dev/null -w "Auth: HTTP %{http_code}\n"
